<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Cookbook</title>
  <style>
    html, body { margin: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 14px; background: #e9e6df; font: 14px system-ui, sans-serif; color: #4a453d; padding: 10px 0 18px; box-sizing: border-box; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 0 10px; }
    button, select { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #b9ab8f; background: #fdfcf8; color: inherit; }
    #status { min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }
    #loading { color: #8a7f6c; }
  </style>
</head>
<body>
  <div id="loading">Setting type…</div>
  <canvas id="book" hidden></canvas>
  <div class="controls">
    <button id="prev">◀ Prev</button>
    <span id="status"></span>
    <button id="next">Next ▶</button>
    <select id="trim" title="Page size">
      <option value="auto">Page: auto</option>
      <option value="book">8 × 10 in book</option>
      <option value="phone">4.5 × 7.5 in phone</option>
    </select>
    <label><input type="checkbox" id="guides"> Layout guides</label>
  </div>

  <script type="module">
    import { Book } from './crease.js';
    import { parseRecipe } from './recipe-md.js';
    import { TEMPLATES, loadFonts, loadImages, typesetRecipe, drawPage, coverPage, platePage, textPage } from './typeset.js';

    const canvas = document.getElementById('book');
    const status = document.getElementById('status');
    const state = { trim: 'auto', guides: false, page: 1 };
    let book, lastKey;

    const [recipe] = await Promise.all([
      fetch('/recipes/shepherds-pie.md').then((r) => r.text()).then(parseRecipe),
      loadFonts(),
    ]);
    const images = await loadImages(recipe);
    const pie = images.get('/art/shepherds-pie.svg'), sprig = images.get('/art/rosemary.svg');

    // Portrait phones read one page at a time, on the phone trim.
    const portraitPhone = () => matchMedia('(orientation: portrait)').matches && innerWidth < 760;

    function build() {
      const phone = portraitPhone();
      const tplName = state.trim === 'auto' ? (phone ? 'phone' : 'book') : state.trim;
      const display = phone ? 'single' : 'double';
      const tpl = TEMPLATES[tplName];
      const key = [tplName, display, state.guides, innerWidth, innerHeight].join('|');
      if (key === lastKey) return;
      lastKey = key;
      if (book) state.page = book.page;

      // Book: cover, a full-page plate facing the recipe, the recipe, back cover.
      const pages = [
        coverPage(tpl, { title: 'Internet Cookbook', subtitle: 'Recipes set by hand, on the web', art: sprig }),
        platePage(tpl, { art: pie, caption: 'Shepherd’s pie, fresh from the oven' }),
        ...typesetRecipe(recipe, tpl, images),
      ];
      if (pages.length % 2 === 0) pages.push(textPage(tpl, [''])); // back cover lands on a left page
      pages.push(textPage(tpl, ['Typeset with Pretext', `${tpl.name} · ${new Date().getFullYear()}`]));

      // Page size on screen: as large as fits, keeping the trim's proportions.
      const pad = phone ? 12 : 28;
      const aspect = tpl.page.height / tpl.page.width;
      const availW = (innerWidth - 2 * pad) / (display === 'double' ? 2 : 1);
      const availH = innerHeight - 2 * pad - 90;
      const pageWidth = Math.floor(Math.max(160, Math.min(availW, availH / aspect, 640)));

      book?.destroy();
      book = new Book(canvas, {
        pages: pages.map((p, i) => (g, W, H) => {
          g.scale(W / tpl.page.width, H / tpl.page.height);
          drawPage(g, p, tpl, { pageNumber: i + 1, guides: state.guides });
        }),
        pageWidth,
        pageHeight: Math.round(pageWidth * aspect),
        display,
        padding: pad,
        hard: [1, pages.length],
        onTurn: update,
      });
      book.goTo(state.page);
      update();
    }

    function update() {
      status.textContent = `page ${book.page} / ${book.pageCount}`;
    }

    build();
    document.getElementById('loading').remove();
    canvas.hidden = false;

    document.getElementById('prev').onclick = () => book.prev();
    document.getElementById('next').onclick = () => book.next();
    document.getElementById('trim').onchange = (e) => { state.trim = e.target.value; build(); };
    document.getElementById('guides').onchange = (e) => { state.guides = e.target.checked; build(); };
    let resizeTimer;
    addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(build, 150); });
    window.book = () => book;
  </script>
</body>
</html>
