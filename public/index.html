<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Cookbook</title>
  <meta name="description" content="A family cookbook you can page through: recipes typeset like a printed book and turned like real paper.">
  <meta name="theme-color" content="#3d4a3a">
  <link rel="canonical" href="https://internet-cookbook.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Internet Cookbook">
  <meta property="og:description" content="Recipes set by hand, on the web.">
  <meta property="og:url" content="https://internet-cookbook.com/">
  <meta property="og:image" content="https://internet-cookbook.com/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="loading">Setting type…</div>
  <canvas id="book" hidden></canvas>
  <div class="controls">
    <button id="prev">◀ Prev</button>
    <span id="status"></span>
    <button id="next">Next ▶</button>
    <select id="trim" title="Page size">
      <option value="auto">Page: auto</option>
      <option value="book">8 × 10 in book</option>
      <option value="phone">4.5 × 7.5 in phone</option>
    </select>
    <label><input type="checkbox" id="guides"> Layout guides</label>
  </div>
  <div id="site-links"><a href="/licenses.html">Licences</a></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
