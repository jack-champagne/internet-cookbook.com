# A frozen copy of the book for the visual regression tests (e2e/visual.e2e.js).
# Do not update it with content changes: it exists so that screenshots change
# only when the code that lays out and draws books changes. The fonts are taken
# from books/internet-cookbook/fonts/ when the test runs.
title: Internet Cookbook
subtitle: Recipes set by hand, on the web
license: # kept as it was when the screenshots were made
  name: public domain (CC0)
theme: theme.yaml
cover:
  art: art/rosemary.svg

front:
  - toc # table of contents, generated
  - page: intro.md

chapters:
  - title: Hearth & Home
    opener:
      art: art/rosemary.svg
    entries:
      - recipe: chapters/hearth-and-home/shepherds-pie.md
        plate:
          art: art/shepherds-pie.svg
          caption: Shepherd’s pie, fresh from the oven
      - recipe: chapters/hearth-and-home/hamburg-and-rice.md

back:
  - colophon # credits page, generated
